<div [class]="themeLevel.themeData()">
  <div class="header">
    <button><span class="material-symbols-outlined">menu</span></button>
    <button (click)="themeToggle()"><span class="material-symbols-outlined">{{themeButtonData}}</span></button>
  </div>

  <div class="hexagon-menu">
    @for (item of hexagonTitle; track item; let idx = $index) {
    <hexagon class="hexagon-item-ex" [title]="item"></hexagon>
    }
  </div>
</div>
